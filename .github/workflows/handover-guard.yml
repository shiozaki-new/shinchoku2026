name: AI引き継ぎ検査

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  handover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 正本と会議項目を検査
        run: python3 Scripts/handover_guard.py
      - name: コミットが参照するIssue番号を検査
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -u
          if [ -n "${BASE:-}" ]; then
            RANGE="$BASE..HEAD"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            RANGE="$BEFORE..$HEAD_SHA"
          else
            RANGE="HEAD~1..HEAD"
          fi
          failed=0
          for sha in $(git rev-list "$RANGE"); do
            if [ "$(git rev-list --parents -n 1 "$sha" | wc -w)" -gt 2 ]; then continue; fi
            committed_at=$(git show -s --format=%cI "$sha")
            refs=$(git show -s --format='%s%n%b' "$sha" | grep -oE '#[0-9]+' | tr -d '#' | sort -u || true)
            for number in $refs; do
              created=$(gh api "repos/$REPO/issues/$number" --jq .created_at 2>/dev/null || true)
              if [ -z "$created" ]; then
                echo "::error::${sha} が参照する #${number} は存在しない"
                failed=1
              elif [ "$created" \> "$committed_at" ]; then
                echo "::error::${sha} が参照する #${number} はコミットより後に作成された"
                failed=1
              fi
            done
          done
          exit $failed
