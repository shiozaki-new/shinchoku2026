name: 思鳴会議の状態

on:
  issues:
    types: [opened, reopened]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 状態ラベルを存在させる
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api -X POST "repos/$REPO/labels" -f name='思鳴未確定' -f color='D93F0B' -f description='オーナーがなぜ・成立条件を定める。AIは推測で実装しない' >/dev/null 2>&1 || true
          gh api -X POST "repos/$REPO/labels" -f name='実装中' -f color='1D76DB' -f description='思鳴が確定し、AIが示応を実装している' >/dev/null 2>&1 || true
          gh api -X POST "repos/$REPO/labels" -f name='応確認中' -f color='0E8A16' -f description='現物で成立を確認する段階' >/dev/null 2>&1 || true
      - name: 状態が無いIssueを思鳴未確定へ置く
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          set -eu
          labels=$(gh api "repos/$REPO/issues/$NUMBER" --jq '[.labels[].name] | join(",")')
          case ",$labels," in
            *,思鳴未確定,*|*,実装中,*|*,応確認中,*)
              echo "状態ラベルあり: $labels" ;;
            *)
              gh api -X POST "repos/$REPO/issues/$NUMBER/labels" -f "labels[]=思鳴未確定" ;;
          esac
